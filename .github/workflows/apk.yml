name: APK yig'ish

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
  RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
  RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
  RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build selected APK
        id: build
        shell: bash
        run: |
          set -euo pipefail
          release_ready=true
          for value in "$RELEASE_KEYSTORE_BASE64" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              release_ready=false
            fi
          done

          if [[ "$release_ready" == true ]]; then
            umask 077
            keystore_file="$RUNNER_TEMP/gotopik-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
            export RELEASE_KEYSTORE_FILE="$keystore_file"
            gradle --no-daemon --stacktrace --console=plain -p android :app:assembleRelease \
              -PverCode="${GITHUB_RUN_NUMBER}" \
              -PversionName="1.0.${GITHUB_RUN_NUMBER}"
            cp android/app/build/outputs/apk/release/app-release.apk GoTopic-release.apk
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "artifact=GoTopic-release.apk" >> "$GITHUB_OUTPUT"
          else
            gradle --no-daemon --stacktrace --console=plain -p android :app:assembleDebug \
              -PverCode="${GITHUB_RUN_NUMBER}" \
              -PversionName="1.0.${GITHUB_RUN_NUMBER}"
            cp android/app/build/outputs/apk/debug/app-debug.apk GoTopic-debug.apk
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "artifact=GoTopic-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GoTopic-${{ steps.build.outputs.variant }}
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Go Topic APK
          body: >-
            Android uchun o'rnatish fayli. Variant: ${{ steps.build.outputs.variant }}.
            Debug varianti sinov sertifikati bilan yig'iladi.
          files: ${{ steps.build.outputs.artifact }}
          make_latest: true
